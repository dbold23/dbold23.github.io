<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shark Scar Annotator">
  <!-- One shark, one mark. The earlier version carried a full keypoint
       skeleton and a scar ring, which turned to mush at dock size; at 50px
       only the silhouette survives, so that is all this draws. -->
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5f8c"/>
      <stop offset="1" stop-color="#0a2463"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="32" ry="32" fill="url(#ssBg)"/>

  <!-- side profile, nose right -->
  <path d="M26 70 C40 58 58 52 78 54 L90 40 L91 56 C99 59 106 64 112 70
           C104 76 95 80 86 82 L88 96 L74 84 C54 85 38 79 26 70 Z"
        fill="#ffffff"/>
  <path d="M62 58 L56 44 L70 55 Z" fill="#ffffff"/>

  <!-- the single annotation point -->
  <circle cx="72" cy="70" r="6" fill="#ffc14d"/>
</svg>
