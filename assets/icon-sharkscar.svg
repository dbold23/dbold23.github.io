<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shark Scar Annotator">
  <!-- A shark inside a detection box, which is what the tool actually does.
       The box is the red bounding box the annotator draws and the squares are
       its drag handles; both sit clear of the tile's rounded corners. -->
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6d9e"/>
      <stop offset="1" stop-color="#0a2144"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="32" ry="32" fill="url(#ssBg)"/>

  <!-- shark, side profile, nose right -->
  <g fill="#ffffff">
    <path d="M112 65
             C101 55.5 88 50 75 48
             L67 48
             L55.5 27
             L48 47.5
             C40 49 32.5 51.5 27 54.5
             L17 32
             L23 62
             L18 92
             L28.5 70.5
             C34 73.5 40.5 75.5 47.5 77
             L54 96
             L67 78.5
             C84 77 100 72.5 112 65 Z"/>
    <path d="M35.5 53 L32 45 L41 51 Z"/>
    <path d="M37 73.5 L33.5 81.5 L42.5 76 Z"/>
  </g>
  <circle cx="100" cy="62.5" r="2.4" fill="#0a2144"/>

  <!-- the annotation box -->
  <rect x="17" y="24" width="94" height="76" rx="1.5" ry="1.5"
        fill="none" stroke="#ff3b3b" stroke-width="3"/>
  <g fill="#ff3b3b">
    <rect x="13"  y="20" width="8" height="8" rx="1.4"/>
    <rect x="107" y="20" width="8" height="8" rx="1.4"/>
    <rect x="13"  y="96" width="8" height="8" rx="1.4"/>
    <rect x="107" y="96" width="8" height="8" rx="1.4"/>
  </g>
</svg>
