<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Daniel Sambold</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #b8e6f5;
      text-align: center;
      background: #0a2463;
      background: radial-gradient(ellipse at 50% 20%, #1e5f8c 0%, #0a2463 45%, #041230 100%);
    }
    .wrap { max-width: 32rem; }
    .code {
      font-size: clamp(5rem, 22vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 4px 30px rgba(61, 157, 217, 0.45);
    }
    .msg {
      margin-top: 1rem;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      font-weight: 500;
      color: #b8e6f5;
    }
    .sub {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: rgba(184, 230, 245, 0.65);
    }
    .home {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.85rem 1.9rem;
      font-size: 1rem;
      font-weight: 600;
      color: #0a2463;
      background: #b8e6f5;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .home:hover, .home:focus-visible {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(61, 157, 217, 0.5);
      outline: none;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <p class="msg">This page drifted out to sea.</p>
    <p class="sub">The page you were looking for couldn't be found.</p>
    <a class="home" href="https://dbold23.github.io/">Return to shore</a>
  </main>
</body>
</html>
