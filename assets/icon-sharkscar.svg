<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Shark Scar Annotator">
  <defs>
    <linearGradient id="ssBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12608f"/>
      <stop offset="1" stop-color="#06253f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" ry="28" fill="url(#ssBg)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.5" ry="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- shark, nose to the right -->
  <path d="M20 76 C34 62 52 55 72 56 L86 44 L86 58 C96 61 104 66 110 72
